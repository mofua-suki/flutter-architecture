name: Verify architecture
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'pc-ci' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart pub get --enforce-lockfile
        working-directory: tool/lint
      - run: dart analyze
        working-directory: tool/lint
      - run: dart test
        working-directory: tool/lint
      - run: dart format --output=none --set-exit-if-changed lib test tool/lint/lib tool/lint/test tool/mason/*.dart tool/mason/generator
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build web --no-pub
      - run: dart run tool/mason/verify_templates.dart
